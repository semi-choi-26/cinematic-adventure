name: "🤖 Android APK Build"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 수동 실행 가능

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: cinematic-adventure

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Godot 설정
      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # 3. Android Export 템플릿 다운로드
      - name: 📦 Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          godot --headless --quit || true

      # 4. Export 폴더 생성
      - name: 📁 Create Export Directory
        run: mkdir -p builds/android

      # 5. Android APK 빌드
      - name: 🔨 Build Android APK
        run: |
          godot --headless --export-release "Android" builds/android/${{ env.EXPORT_NAME }}.apk

      # 6. APK 파일 업로드
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

      # 7. 파일 크기 확인
      - name: 📊 Check APK Size
        run: |
          echo "### 📱 Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${{ env.EXPORT_NAME }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(du -h builds/android/${{ env.EXPORT_NAME }}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above! 👆" >> $GITHUB_STEP_SUMMARY

  # 태그 푸시 시 자동 Release 생성
  release:
    name: Create Release
    needs: export-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.EXPORT_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
