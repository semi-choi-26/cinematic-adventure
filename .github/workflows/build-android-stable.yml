name: "🤖 Android APK Build (Stable)"

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  EXPORT_NAME: cinematic-adventure

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: 📦 Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: 🔧 Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          KEYSTORE_PATH=$(readlink -f ~/.android/debug.keystore)
          echo "Keystore at: $KEYSTORE_PATH"

          sed -i "s|keystore/debug=\".*\"|keystore/debug=\"$KEYSTORE_PATH\"|g" export_presets.cfg

          echo "Updated export_presets.cfg:"
          grep "keystore" export_presets.cfg

      - name: 📁 Setup Build Directory
        run: mkdir -p builds/android

      - name: 🔨 Build Android APK
        run: |
          godot --headless --verbose --export-release "Android" builds/android/${EXPORT_NAME}.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

      - name: 📊 Build Summary
        run: |
          echo "### 📱 Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${EXPORT_NAME}.apk" >> $GITHUB_STEP_SUMMARY
          if [ -f "builds/android/${EXPORT_NAME}.apk" ]; then
            echo "**Size:** $(du -h builds/android/${EXPORT_NAME}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
