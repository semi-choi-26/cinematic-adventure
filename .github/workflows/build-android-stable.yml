name: "🤖 Android APK Build (Stable)"

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  EXPORT_NAME: cinematic-adventure

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: 📦 Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          # Godot 4.3 Export Templates 다운로드
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          # 압축 해제
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp/templates

          # 템플릿 복사
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

          # 확인
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: 🔧 Setup Java SDK & Debug Keystore
        run: |
          # Debug Keystore 생성
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Godot Editor Settings
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "'$HOME'/.android/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres
          echo "Debug keystore created and configured"

      - name: 📁 Setup Build Directory
        run: mkdir -p builds/android

      - name: 🔨 Build Android APK
        run: |
          godot --headless --verbose --export-release "Android" builds/android/${EXPORT_NAME}.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

      - name: 📊 Build Summary
        run: |
          echo "### 📱 Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${EXPORT_NAME}.apk" >> $GITHUB_STEP_SUMMARY
          if [ -f "builds/android/${EXPORT_NAME}.apk" ]; then
            echo "**Size:** $(du -h builds/android/${EXPORT_NAME}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Build failed - APK not found" >> $GITHUB_STEP_SUMMARY
          fi
