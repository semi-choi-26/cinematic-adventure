name: "🤖 Android APK Build (Stable)"

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  EXPORT_NAME: cinematic-adventure

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: 🔧 Setup Export Templates
        run: |
          # Docker 이미지의 템플릿 경로 확인
          echo "=== Checking template paths ==="
          ls -la /root/.local/share/godot/ || true
          ls -la ~/.local/share/godot/ || true

          # 템플릿 디렉토리 생성
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          # Docker 이미지의 템플릿 복사 (여러 가능한 경로 시도)
          if [ -d "/root/.local/share/godot/templates/4.3.stable" ]; then
            echo "Found templates in /root/.local/share/godot/templates/4.3.stable"
            cp -r /root/.local/share/godot/templates/4.3.stable/* \
                  ~/.local/share/godot/export_templates/4.3.stable/
          elif [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            echo "Found templates in /root/.local/share/godot/export_templates/4.3.stable"
            cp -r /root/.local/share/godot/export_templates/4.3.stable/* \
                  ~/.local/share/godot/export_templates/4.3.stable/
          fi

          # 확인
          echo "=== Templates after copy ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ || echo "No templates found!"

      - name: 📁 Setup Build Directory
        run: mkdir -p builds/android

      - name: 🔨 Build Android APK
        run: |
          godot --headless --verbose --export-release "Android" builds/android/${EXPORT_NAME}.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

      - name: 📊 Build Summary
        run: |
          echo "### 📱 Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${EXPORT_NAME}.apk" >> $GITHUB_STEP_SUMMARY
          if [ -f "builds/android/${EXPORT_NAME}.apk" ]; then
            echo "**Size:** $(du -h builds/android/${EXPORT_NAME}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Build failed - APK not found" >> $GITHUB_STEP_SUMMARY
          fi
