name: "🌐 Deploy to Netlify"

on:
  workflow_run:
    workflows: ["🌐 HTML5 Web Build"]
    types:
      - completed
  workflow_dispatch:

env:
  NETLIFY_SITE_NAME: cinematic-adventure

jobs:
  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📦 Download Web Build Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-web.yml
          name: web-build
          path: builds/web

      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './builds/web'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: 📊 Deployment Summary
        run: |
          echo "### 🌐 Netlify Deployment Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site**: https://${{ env.NETLIFY_SITE_NAME }}.netlify.app" >> $GITHUB_STEP_SUMMARY
