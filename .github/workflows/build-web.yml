name: "🌐 HTML5 Web Build"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: cinematic-adventure

jobs:
  export-web:
    name: HTML5 Export
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: 📁 Create Export Directory
        run: mkdir -p builds/web

      - name: 🔨 Build HTML5
        run: |
          godot --headless --export-release "HTML5" builds/web/index.html

      - name: 📤 Upload Web Build
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: builds/web/
          retention-days: 14

      # GitHub Pages 자동 배포 (선택사항)
      - name: 🚀 Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds/web
          cname: # 커스텀 도메인이 있으면 여기에 입력
